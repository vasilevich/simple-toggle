<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Simple Toggle · Value</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="login-shell">
    <section class="login-card value-page-card">
        <div class="eyebrow">VALUE CONTROL</div>
        <h1 id="key">Loading…</h1>
        <p id="description">Loading value control…</p>
        <form id="value-form">
            <label>Value<input type="text" id="value" autocomplete="off"></label>
            <button id="save-button" type="submit" class="button button-primary">Save value</button>
        </form>
        <div id="page-message" class="alert" hidden></div>
        <div class="value-link-block">
            <span>Raw value URL</span>
            <div class="value-row">
                <input id="value-url" readonly>
                <button id="copy-value-url" class="button button-secondary button-small" type="button">Copy</button>
            </div>
        </div>
        <a class="button button-secondary back-link" href="/">Back to dashboard</a>
    </section>
</main>
<script src="js/bot_value_set.js"></script>
</body>
</html>
